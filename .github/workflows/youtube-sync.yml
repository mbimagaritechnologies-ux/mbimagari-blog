name: Sync YouTube to Blog
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install parser
        run: npm install rss-parser
      - name: Sync videos
        run: |
          cat > sync.js <<'ENDJS'
          const Parser = require('rss-parser');
          const fs = require('fs');
          const path = require('path');
          const parser = new Parser();
          (async () => {
            const feed = await parser.parseURL('https://www.youtube.com/feeds/videos.xml?channel_id=UCjBeBu8gQM0p9aParvL3FFQ');
            console.log(`Found ${feed.items.length} videos`);
            let dir = 'src/pages/posts';
            if (!fs.existsSync('src/pages')) dir = 'src/content/posts';
            if (!fs.existsSync(dir)) fs.mkdirSync(dir, {recursive:true});
            for (const item of feed.items) {
              const slug = item.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60) || item.id.replace('yt:video:','');
              const file = path.join(dir, slug + '.md');
              if (!fs.existsSync(file)) {
                const date = new Date(item.pubDate).toISOString().split('T')[0];
                const vid = item.id.replace('yt:video:','');
                const title = item.title.replace(/"/g,'');
                const content = '---\ntitle: "' + title + '"\ndate: ' + date + '\n---\n\n<iframe width="100%" height="400" src="https://www.youtube.com/embed/' + vid + '" frameborder="0" allowfullscreen></iframe>\n\n' + (item.contentSnippet||'') + '\n\nWatch: ' + item.link + '\n';
                fs.writeFileSync(file, content);
                console.log('Created', file);
              }
            }
          })();
          ENDJS
          node sync.js
      - name: Push
        run: |
          git config user.name "mbimagari-bot"
          git config user.email "bot@mbimagari.autos"
          git add -A
          git diff --staged --quiet || (git commit -m "auto: sync" && git push)
