name: Sync YouTube to Blog
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install rss-parser
      - name: Create posts from YouTube
        run: |
          node - <<'JS'
          const Parser = require('rss-parser');
          const fs = require('fs');
          const parser = new Parser();
          (async () => {
            const feed = await parser.parseURL('https://www.youtube.com/feeds/videos.xml?channel_id=UCjBeBu8gQM0p9aParvL3FFQ');
            console.log(`Found ${feed.items.length} videos`);
            for (const item of feed.items) {
              const slug = item.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60);
              const dir = `src/content/posts`;
              if (!fs.existsSync(dir)) fs.mkdirSync(dir, {recursive:true});
              const file = `${dir}/${slug}.md`;
              if (!fs.existsSync(file)) {
                const date = new Date(item.pubDate).toISOString().split('T')[0];
                const body = `---
title: "${item.title.replace(/"/g,'\\"')}"
date: ${date}
description: "${item.contentSnippet?.slice(0,150).replace(/"/g,'') || item.title}"
---

<iframe width="100%" height="400" src="https://www.youtube.com/embed/${item.id.replace('yt:video:','')}" frameborder="0" allowfullscreen></iframe>

${item.contentSnippet || ''}

**Watch original:** ${item.link}

#mbimagari #review
`;
                fs.writeFileSync(file, body);
                console.log('Created', file);
              }
            }
          })();
          JS
      - name: Commit and push
        run: |
          git config user.name "mbimagari-bot"
          git config user.email "bot@mbimagari.autos"
          git add src/content/posts/ || git add src/pages/posts/
          git diff --staged --quiet || (git commit -m "auto: sync youtube videos" && git push)
